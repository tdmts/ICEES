<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360"
    font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="titel">
    <title id="titel">Sectoren gegroepeerd tot clusters, en de slack in een cluster</title>
    <rect width="720" height="360" fill="#ffffff" />

    <defs>
        <pattern id="arcering" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
            <rect width="8" height="8" fill="#fdf1ef" />
            <line x1="0" y1="0" x2="0" y2="8" stroke="#e0a79f" stroke-width="2" />
        </pattern>
    </defs>

    <!-- zestien sectoren -->
    <text x="40" y="26" font-size="13" fill="#555">Zestien sectoren van 512 bytes</text>

    <g stroke="#9bb0ac" fill="#f5f7f7">
        <rect x="40" y="36" width="40" height="34" />
        <rect x="80" y="36" width="40" height="34" />
        <rect x="120" y="36" width="40" height="34" />
        <rect x="160" y="36" width="40" height="34" />
        <rect x="200" y="36" width="40" height="34" />
        <rect x="240" y="36" width="40" height="34" />
        <rect x="280" y="36" width="40" height="34" />
        <rect x="320" y="36" width="40" height="34" />
        <rect x="360" y="36" width="40" height="34" />
        <rect x="400" y="36" width="40" height="34" />
        <rect x="440" y="36" width="40" height="34" />
        <rect x="480" y="36" width="40" height="34" />
        <rect x="520" y="36" width="40" height="34" />
        <rect x="560" y="36" width="40" height="34" />
        <rect x="600" y="36" width="40" height="34" />
        <rect x="640" y="36" width="40" height="34" />
    </g>

    <g font-size="11" fill="#555" text-anchor="middle">
        <text x="60" y="86">0</text>
        <text x="100" y="86">1</text>
        <text x="140" y="86">2</text>
        <text x="180" y="86">3</text>
        <text x="220" y="86">4</text>
        <text x="260" y="86">5</text>
        <text x="300" y="86">6</text>
        <text x="340" y="86">7</text>
        <text x="380" y="86">8</text>
        <text x="420" y="86">9</text>
        <text x="460" y="86">10</text>
        <text x="500" y="86">11</text>
        <text x="540" y="86">12</text>
        <text x="580" y="86">13</text>
        <text x="620" y="86">14</text>
        <text x="660" y="86">15</text>
    </g>

    <!-- per acht onder een adres -->
    <path d="M40 96 L40 106 L356 106 L356 96" stroke="#004d40" stroke-width="1" fill="none" />
    <path d="M364 96 L364 106 L680 106 L680 96" stroke="#004d40" stroke-width="1" fill="none" />

    <rect x="40" y="114" width="316" height="38" fill="#b2dfdb" stroke="#004d40" />
    <rect x="364" y="114" width="316" height="38" fill="#b2dfdb" stroke="#004d40" />
    <text x="198" y="138" font-size="14" fill="#00332b" text-anchor="middle">cluster op adres 0</text>
    <text x="522" y="138" font-size="14" fill="#00332b" text-anchor="middle">cluster op adres 1</text>

    <text x="40" y="176" font-size="13" fill="#222">Acht sectoren van 512 bytes onder een adres geven een cluster van
        4096 bytes.</text>
    <text x="40" y="196" font-size="13" fill="#222">Met dezelfde adresruimte dek je zo acht keer zoveel schijf.</text>

    <path d="M40 216 L680 216" stroke="#e9ecef" stroke-width="1" />

    <!-- de prijs: slack -->
    <text x="40" y="240" font-size="13" fill="#555">Een bestand krijgt altijd hele clusters</text>

    <text x="40" y="266" font-size="12" fill="#00332b">412 bytes</text>
    <path d="M57 272 L57 284" stroke="#004d40" stroke-width="1" fill="none" />

    <rect x="40" y="284" width="316" height="38" fill="url(#arcering)" stroke="#c0392b" />
    <rect x="40" y="284" width="31.8" height="38" fill="#004d40" stroke="#004d40" />

    <path d="M364 303 L388 303" stroke="#c0392b" stroke-width="1" fill="none" />
    <text x="396" y="308" font-size="13" fill="#c0392b">slack: de rest blijft ongebruikt</text>

    <text x="40" y="346" font-size="13" fill="#222">Hier is het cluster 4096 bytes, de standaardwaarde: 412 bytes
        zijn gebruikt en 3684 blijven leeg.</text>
</svg>
