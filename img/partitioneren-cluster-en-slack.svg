<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330"
    font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="titel">
    <title id="titel">Sectoren gegroepeerd tot clusters, en de slack in een cluster</title>
    <rect width="720" height="330" fill="#ffffff" />

    <defs>
        <pattern id="arcering" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
            <rect width="8" height="8" fill="#fdf1ef" />
            <line x1="0" y1="0" x2="0" y2="8" stroke="#e0a79f" stroke-width="2" />
        </pattern>
    </defs>

    <!-- rij sectoren -->
    <text x="40" y="32" font-size="13" fill="#555">Sectoren van 512 bytes</text>

    <g stroke="#9bb0ac" fill="#f5f7f7">
        <rect x="40" y="42" width="78" height="34" />
        <rect x="118" y="42" width="78" height="34" />
        <rect x="196" y="42" width="78" height="34" />
        <rect x="274" y="42" width="78" height="34" />
        <rect x="360" y="42" width="78" height="34" />
        <rect x="438" y="42" width="78" height="34" />
        <rect x="516" y="42" width="78" height="34" />
        <rect x="594" y="42" width="78" height="34" />
    </g>

    <!-- groepering -->
    <path d="M40 84 L40 94 L352 94 L352 84" stroke="#004d40" stroke-width="1" fill="none" />
    <path d="M360 84 L360 94 L672 94 L672 84" stroke="#004d40" stroke-width="1" fill="none" />

    <rect x="40" y="102" width="312" height="40" fill="#b2dfdb" stroke="#004d40" />
    <rect x="360" y="102" width="312" height="40" fill="#b2dfdb" stroke="#004d40" />
    <text x="196" y="127" font-size="14" fill="#00332b" text-anchor="middle">cluster op adres 0</text>
    <text x="516" y="127" font-size="14" fill="#00332b" text-anchor="middle">cluster op adres 1</text>

    <text x="40" y="164" font-size="13" fill="#222">Acht sectoren van 512 bytes onder één adres geven een cluster van
        4 kB. Met dezelfde</text>
    <text x="40" y="184" font-size="13" fill="#222">adresruimte dek je zo acht keer zoveel schijf.</text>

    <path d="M40 204 L680 204" stroke="#e9ecef" stroke-width="1" />

    <!-- slack -->
    <text x="40" y="228" font-size="13" fill="#555">Een bestand krijgt altijd hele clusters</text>

    <text x="40" y="256" font-size="12" fill="#00332b">412 bytes</text>
    <path d="M57 262 L57 274" stroke="#004d40" stroke-width="1" fill="none" />

    <rect x="40" y="274" width="312" height="34" fill="url(#arcering)" stroke="#c0392b" />
    <rect x="40" y="274" width="34" height="34" fill="#004d40" stroke="#004d40" />

    <path d="M368 291 L392 291" stroke="#c0392b" stroke-width="1" fill="none" />
    <text x="400" y="296" font-size="13" fill="#c0392b">slack: de rest van het cluster blijft ongebruikt</text>
</svg>
