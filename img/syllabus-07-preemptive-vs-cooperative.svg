<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 770 360" width="770" height="360"
    font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="titel">
    <title id="titel">Preemptive tegenover cooperative multitasking: bovenaan verdeelt de process scheduler de tijd in
        stukjes en onderbreekt hij de processen, onderaan geeft een proces zelf af wanneer het klaar is</title>
    <rect width="770" height="360" fill="#ffffff" />

    <defs>
        <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#004d40" />
        </marker>
    </defs>

    <!-- bovenste rij: preemptive -->
    <text x="15" y="34" font-size="17" fill="#00332b" font-weight="bold">Preemptive</text>

    <rect x="15" y="58" width="130" height="68" fill="#004d40" stroke="#004d40" />
    <text x="80" y="88" font-size="14" fill="#ffffff" text-anchor="middle">process</text>
    <text x="80" y="108" font-size="14" fill="#ffffff" text-anchor="middle">scheduler</text>

    <path d="M 148 74 L 268 74" stroke="#004d40" stroke-width="2" fill="none" marker-end="url(#p)" />
    <text x="208" y="66" font-size="13" fill="#004d40" text-anchor="middle">Proces 1</text>
    <path d="M 148 110 L 268 110" stroke="#004d40" stroke-width="2" fill="none" marker-end="url(#p)" />
    <text x="208" y="102" font-size="13" fill="#004d40" text-anchor="middle">Proces 2</text>

    <rect x="272" y="60" width="476" height="28" fill="#ffffff" stroke="#d5dedc" />
    <rect x="272" y="96" width="476" height="28" fill="#ffffff" stroke="#d5dedc" />

    <rect x="274" y="62" width="115" height="24" fill="#004d40" />
    <rect x="512" y="62" width="115" height="24" fill="#004d40" />
    <rect x="393" y="98" width="115" height="24" fill="#b2dfdb" stroke="#004d40" />
    <rect x="631" y="98" width="115" height="24" fill="#b2dfdb" stroke="#004d40" />

    <path d="M 391 52 L 391 132" stroke="#c0392b" stroke-width="2" stroke-dasharray="5 4" fill="none" />
    <path d="M 510 52 L 510 132" stroke="#c0392b" stroke-width="2" stroke-dasharray="5 4" fill="none" />
    <path d="M 629 52 L 629 132" stroke="#c0392b" stroke-width="2" stroke-dasharray="5 4" fill="none" />
    <text x="510" y="150" font-size="13" fill="#c0392b" text-anchor="middle">de scheduler onderbreekt</text>

    <!-- onderste rij: cooperative -->
    <text x="15" y="214" font-size="17" fill="#00332b" font-weight="bold">Cooperative</text>

    <rect x="15" y="238" width="130" height="32" fill="#e0e7e5" stroke="#004d40" />
    <text x="80" y="259" font-size="14" fill="#00332b" text-anchor="middle">Proces 1</text>
    <rect x="15" y="286" width="130" height="32" fill="#e0e7e5" stroke="#004d40" />
    <text x="80" y="307" font-size="14" fill="#00332b" text-anchor="middle">Proces 2</text>

    <path d="M 148 254 L 268 254" stroke="#004d40" stroke-width="2" fill="none" marker-end="url(#p)" />
    <path d="M 148 302 L 268 302" stroke="#004d40" stroke-width="2" fill="none" marker-end="url(#p)" />

    <rect x="272" y="240" width="476" height="28" fill="#ffffff" stroke="#d5dedc" />
    <rect x="272" y="288" width="476" height="28" fill="#ffffff" stroke="#d5dedc" />

    <rect x="274" y="242" width="335" height="24" fill="#004d40" />
    <rect x="614" y="290" width="132" height="24" fill="#b2dfdb" stroke="#004d40" />

    <path d="M 611 232 L 611 324" stroke="#004d40" stroke-width="2" stroke-dasharray="5 4" fill="none" />
    <text x="611" y="342" font-size="13" fill="#004d40" text-anchor="middle">proces 1 geeft zelf af</text>
</svg>
