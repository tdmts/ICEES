<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 330" width="740" height="330"
     font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect width="740" height="330" fill="#ffffff"/>

    <text x="40" y="20" font-size="12" fill="#555555">Een schijf bestaat uit sectoren van elk 512 bytes</text>

    <!-- de sectoren van de schijf, met sector 0 uitgelicht -->
    <rect x="40" y="36" width="138" height="50" fill="#004d40" stroke="#004d40"/>
    <text x="109" y="58" font-size="12" fill="#ffffff" text-anchor="middle">Sector 0</text>
    <text x="109" y="74" font-size="10" fill="#ffffff" text-anchor="middle">master boot record</text>

    <rect x="178" y="36" width="87" height="50" fill="#e0e7e5" stroke="#004d40"/>
    <text x="221" y="65" font-size="11" fill="#222222" text-anchor="middle">Sector 1</text>
    <rect x="265" y="36" width="87" height="50" fill="#e0e7e5" stroke="#004d40"/>
    <text x="308" y="65" font-size="11" fill="#222222" text-anchor="middle">Sector 2</text>
    <rect x="352" y="36" width="87" height="50" fill="#e0e7e5" stroke="#004d40"/>
    <text x="395" y="65" font-size="11" fill="#222222" text-anchor="middle">Sector 3</text>
    <rect x="439" y="36" width="61" height="50" fill="#e0e7e5" stroke="#004d40"/>
    <text x="469" y="65" font-size="11" fill="#222222" text-anchor="middle">...</text>
    <rect x="500" y="36" width="100" height="50" fill="#e0e7e5" stroke="#004d40"/>
    <text x="550" y="65" font-size="11" fill="#222222" text-anchor="middle">Sector N-2</text>
    <rect x="600" y="36" width="100" height="50" fill="#e0e7e5" stroke="#004d40"/>
    <text x="650" y="65" font-size="11" fill="#222222" text-anchor="middle">Sector N-1</text>

    <!-- sector 0 uitvergroot naar de balk eronder -->
    <path d="M 40 86 L 40 200" fill="none" stroke="#004d40" stroke-dasharray="4 3" stroke-opacity="0.6"/>
    <path d="M 178 86 L 700 200" fill="none" stroke="#004d40" stroke-dasharray="4 3" stroke-opacity="0.6"/>

    <text x="48" y="192" font-size="12" fill="#004d40">Het master boot record: 512 bytes</text>

    <!-- de 512 bytes, op schaal -->
    <rect x="40" y="200" width="567.2" height="50" fill="#b2dfdb" stroke="#004d40"/>
    <text x="323.6" y="228" font-size="13" fill="#222222" text-anchor="middle">opstartcode</text>
    <text x="323.6" y="244" font-size="11" fill="#222222" text-anchor="middle">440 bytes</text>

    <rect x="607.2" y="200" width="5.2" height="50" fill="#e0e7e5" stroke="#004d40"/>
    <rect x="612.4" y="200" width="2.4" height="50" fill="#ffffff" stroke="#004d40"/>

    <rect x="614.8" y="200" width="82.6" height="50" fill="#004d40" stroke="#004d40"/>
    <text x="656.1" y="220" font-size="11" fill="#ffffff" text-anchor="middle">partitie-</text>
    <text x="656.1" y="233" font-size="11" fill="#ffffff" text-anchor="middle">tabel</text>
    <text x="656.1" y="246" font-size="10" fill="#ffffff" text-anchor="middle">64 bytes</text>

    <rect x="697.4" y="200" width="2.6" height="50" fill="#e0e7e5" stroke="#004d40"/>

    <!-- legende, want drie van de vijf velden zijn op schaal maar een haarlijn breed -->
    <rect x="40" y="262" width="11" height="11" fill="#b2dfdb" stroke="#004d40"/>
    <text x="58" y="272" font-size="11" fill="#222222">opstartcode, 440 bytes</text>
    <rect x="40" y="281" width="11" height="11" fill="#e0e7e5" stroke="#004d40"/>
    <text x="58" y="291" font-size="11" fill="#222222">schijfhandtekening, 4 bytes</text>
    <rect x="40" y="300" width="11" height="11" fill="#ffffff" stroke="#004d40"/>
    <text x="58" y="310" font-size="11" fill="#222222">nullen, 2 bytes</text>

    <rect x="390" y="262" width="11" height="11" fill="#004d40" stroke="#004d40"/>
    <text x="408" y="272" font-size="11" fill="#222222">partitietabel, 64 bytes</text>
    <text x="408" y="291" font-size="11" fill="#555555">vier ingangen van 16 bytes</text>
    <rect x="390" y="300" width="11" height="11" fill="#e0e7e5" stroke="#004d40"/>
    <text x="408" y="310" font-size="11" fill="#222222">handtekening, 2 bytes</text>
</svg>
