<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 210" width="720" height="210"
    font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="titel">
    <title id="titel">De nummering van partities op een schijf met een MBR-partitietabel</title>
    <rect width="720" height="210" fill="#ffffff" />

    <text x="40" y="32" font-size="13" fill="#555">De schijf <tspan fill="#222">/dev/sda</tspan></text>

    <rect x="40" y="44" width="150" height="56" fill="#e0e7e5" stroke="#9bb0ac" />
    <rect x="190" y="44" width="120" height="56" fill="#e0e7e5" stroke="#9bb0ac" />
    <text x="115" y="70" font-size="14" fill="#222" text-anchor="middle">/dev/sda1</text>
    <text x="250" y="70" font-size="14" fill="#222" text-anchor="middle">/dev/sda2</text>
    <text x="115" y="88" font-size="12" fill="#555" text-anchor="middle">primair</text>
    <text x="250" y="88" font-size="12" fill="#555" text-anchor="middle">primair</text>

    <rect x="310" y="38" width="370" height="68" fill="#ffffff" stroke="#004d40" stroke-width="2" />
    <text x="495" y="54" font-size="12" fill="#004d40" text-anchor="middle">/dev/sda3, extended</text>

    <rect x="320" y="62" width="112" height="36" fill="#e0e7e5" stroke="#9bb0ac" />
    <rect x="439" y="62" width="112" height="36" fill="#e0e7e5" stroke="#9bb0ac" />
    <rect x="558" y="62" width="112" height="36" fill="#e0e7e5" stroke="#9bb0ac" />
    <text x="376" y="79" font-size="13" fill="#222" text-anchor="middle">/dev/sda5</text>
    <text x="495" y="79" font-size="13" fill="#222" text-anchor="middle">/dev/sda6</text>
    <text x="614" y="79" font-size="13" fill="#222" text-anchor="middle">/dev/sda7</text>
    <text x="376" y="93" font-size="11" fill="#555" text-anchor="middle">logisch</text>
    <text x="495" y="93" font-size="11" fill="#555" text-anchor="middle">logisch</text>
    <text x="614" y="93" font-size="11" fill="#555" text-anchor="middle">logisch</text>

    <text x="40" y="140" font-size="13" fill="#222">Drie van de vier tabelplaatsen zijn hier bezet, dus
        <tspan fill="#c0392b">/dev/sda4 bestaat niet</tspan>. De nummers 1 tot 4</text>
    <text x="40" y="160" font-size="13" fill="#222">blijven voorbehouden voor die plaatsen, en de logische partities
        beginnen daarom bij 5.</text>
    <text x="40" y="186" font-size="13" fill="#222">Dat blijft zo met één primaire partitie: de eerste logische heet
        dan nog altijd /dev/sda5.</text>
</svg>
