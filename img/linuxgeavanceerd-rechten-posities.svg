<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 250" width="620" height="250"
    font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect width="620" height="250" fill="#ffffff"/>

    <!-- kopregel: de tien tekens zoals ls ze afdrukt -->
    <text x="310" y="28" text-anchor="middle" font-size="15" fill="#222">Zo staan de tien tekens in de regel van
        ls</text>

    <!-- labels boven de vier groepjes -->
    <text x="112" y="60" text-anchor="middle" font-size="14" fill="#004d40" font-weight="bold">soort</text>
    <text x="200" y="60" text-anchor="middle" font-size="14" fill="#004d40" font-weight="bold">owner</text>
    <text x="332" y="60" text-anchor="middle" font-size="14" fill="#004d40" font-weight="bold">group</text>
    <text x="464" y="60" text-anchor="middle" font-size="14" fill="#004d40" font-weight="bold">other</text>

    <!-- haken die elk label aan zijn tekens binden -->
    <path d="M 92 68 L 92 76 L 132 76 L 132 68" fill="none" stroke="#004d40" stroke-width="1.5"/>
    <path d="M 136 68 L 136 76 L 264 76 L 264 68" fill="none" stroke="#004d40" stroke-width="1.5"/>
    <path d="M 268 68 L 268 76 L 396 76 L 396 68" fill="none" stroke="#004d40" stroke-width="1.5"/>
    <path d="M 400 68 L 400 76 L 528 76 L 528 68" fill="none" stroke="#004d40" stroke-width="1.5"/>

    <!-- de tien vakjes -->
    <g font-family="Consolas, Menlo, Monaco, monospace" font-size="26" text-anchor="middle" fill="#222">
        <rect x="90" y="84" width="44" height="52" fill="#b2dfdb" stroke="#004d40" stroke-width="1.5"/>
        <text x="112" y="118">d</text>

        <rect x="134" y="84" width="44" height="52" fill="#e0e7e5" stroke="#004d40" stroke-width="1.5"/>
        <text x="156" y="118">r</text>
        <rect x="178" y="84" width="44" height="52" fill="#e0e7e5" stroke="#004d40" stroke-width="1.5"/>
        <text x="200" y="118">w</text>
        <rect x="222" y="84" width="44" height="52" fill="#e0e7e5" stroke="#004d40" stroke-width="1.5"/>
        <text x="244" y="118">x</text>

        <rect x="266" y="84" width="44" height="52" fill="#e0e7e5" stroke="#004d40" stroke-width="1.5"/>
        <text x="288" y="118">r</text>
        <rect x="310" y="84" width="44" height="52" fill="#e0e7e5" stroke="#004d40" stroke-width="1.5"/>
        <text x="332" y="118">-</text>
        <rect x="354" y="84" width="44" height="52" fill="#e0e7e5" stroke="#004d40" stroke-width="1.5"/>
        <text x="376" y="118">x</text>

        <rect x="398" y="84" width="44" height="52" fill="#e0e7e5" stroke="#004d40" stroke-width="1.5"/>
        <text x="420" y="118">r</text>
        <rect x="442" y="84" width="44" height="52" fill="#e0e7e5" stroke="#004d40" stroke-width="1.5"/>
        <text x="464" y="118">-</text>
        <rect x="486" y="84" width="44" height="52" fill="#e0e7e5" stroke="#004d40" stroke-width="1.5"/>
        <text x="508" y="118">x</text>
    </g>

    <!-- wat elke plaats binnen een groepje betekent -->
    <g font-size="11" text-anchor="middle" fill="#5a6664">
        <text x="156" y="152">read</text>
        <text x="200" y="152">write</text>
        <text x="244" y="152">exec</text>
        <text x="288" y="152">read</text>
        <text x="332" y="152">write</text>
        <text x="376" y="152">exec</text>
        <text x="420" y="152">read</text>
        <text x="464" y="152">write</text>
        <text x="508" y="152">exec</text>
    </g>

    <!-- haken naar het cijfer per groepje -->
    <path d="M 136 166 L 136 174 L 264 174 L 264 166" fill="none" stroke="#004d40" stroke-width="1.5"/>
    <path d="M 268 166 L 268 174 L 396 174 L 396 166" fill="none" stroke="#004d40" stroke-width="1.5"/>
    <path d="M 400 166 L 400 174 L 528 174 L 528 166" fill="none" stroke="#004d40" stroke-width="1.5"/>
    <line x1="200" y1="174" x2="200" y2="184" stroke="#004d40" stroke-width="1.5"/>
    <line x1="332" y1="174" x2="332" y2="184" stroke="#004d40" stroke-width="1.5"/>
    <line x1="464" y1="174" x2="464" y2="184" stroke="#004d40" stroke-width="1.5"/>

    <g font-family="Consolas, Menlo, Monaco, monospace" font-size="26" text-anchor="middle" fill="#004d40"
        font-weight="bold">
        <text x="200" y="212">7</text>
        <text x="332" y="212">5</text>
        <text x="464" y="212">5</text>
    </g>

    <text x="310" y="238" text-anchor="middle" font-size="14" fill="#222">De drie cijfers samen zijn 755</text>

    <!-- het eerste teken hoort niet bij de cijfers -->
    <text x="112" y="152" text-anchor="middle" font-size="11" fill="#c0392b">map</text>
</svg>
