<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 390" width="460" height="390" role="img">
  <style>
    text { font-family: "Segoe UI", Helvetica, Arial, sans-serif; fill: #222; }
    .as { font-size: 24px; font-weight: 700; fill: #004d40; }
    .bij { font-size: 14px; }
    .adres { font-size: 15px; font-weight: 600; fill: #004d40; }
    .rustig { stroke: #b2dfdb; stroke-width: 3; }
    .gekozen { stroke: #004d40; stroke-width: 4; }
    .cel { fill: #ffffff; stroke: #004d40; stroke-width: 2; }
    .knoop { fill: #004d40; }
  </style>
  <rect x="0" y="0" width="460" height="390" fill="#ffffff"/>

  <!-- rijen: A, C en D rustig, B gekozen -->
  <line class="rustig" x1="60" y1="70" x2="345" y2="70"/>
  <line class="gekozen" x1="60" y1="130" x2="345" y2="130"/>
  <line class="rustig" x1="60" y1="190" x2="345" y2="190"/>
  <line class="rustig" x1="60" y1="250" x2="345" y2="250"/>

  <!-- kolommen: 1, 3 en 4 rustig, 2 gekozen -->
  <line class="rustig" x1="100" y1="35" x2="100" y2="285"/>
  <line class="gekozen" x1="170" y1="35" x2="170" y2="285"/>
  <line class="rustig" x1="240" y1="35" x2="240" y2="285"/>
  <line class="rustig" x1="310" y1="35" x2="310" y2="285"/>

  <!-- de zestien cellen -->
  <g>
    <circle class="cel" cx="80" cy="44" r="9"/><line stroke="#004d40" stroke-width="2" x1="80" y1="53" x2="80" y2="70"/><circle class="knoop" cx="100" cy="70" r="3.5"/>
    <circle class="cel" cx="150" cy="44" r="9"/><line stroke="#004d40" stroke-width="2" x1="150" y1="53" x2="150" y2="70"/><circle class="knoop" cx="170" cy="70" r="3.5"/>
    <circle class="cel" cx="220" cy="44" r="9"/><line stroke="#004d40" stroke-width="2" x1="220" y1="53" x2="220" y2="70"/><circle class="knoop" cx="240" cy="70" r="3.5"/>
    <circle class="cel" cx="290" cy="44" r="9"/><line stroke="#004d40" stroke-width="2" x1="290" y1="53" x2="290" y2="70"/><circle class="knoop" cx="310" cy="70" r="3.5"/>

    <circle class="cel" cx="80" cy="104" r="9"/><line stroke="#004d40" stroke-width="2" x1="80" y1="113" x2="80" y2="130"/><circle class="knoop" cx="100" cy="130" r="3.5"/>
    <circle class="cel" cx="150" cy="104" r="9"/><line stroke="#004d40" stroke-width="2" x1="150" y1="113" x2="150" y2="130"/>
    <circle class="cel" cx="220" cy="104" r="9"/><line stroke="#004d40" stroke-width="2" x1="220" y1="113" x2="220" y2="130"/><circle class="knoop" cx="240" cy="130" r="3.5"/>
    <circle class="cel" cx="290" cy="104" r="9"/><line stroke="#004d40" stroke-width="2" x1="290" y1="113" x2="290" y2="130"/><circle class="knoop" cx="310" cy="130" r="3.5"/>

    <circle class="cel" cx="80" cy="164" r="9"/><line stroke="#004d40" stroke-width="2" x1="80" y1="173" x2="80" y2="190"/><circle class="knoop" cx="100" cy="190" r="3.5"/>
    <circle class="cel" cx="150" cy="164" r="9"/><line stroke="#004d40" stroke-width="2" x1="150" y1="173" x2="150" y2="190"/><circle class="knoop" cx="170" cy="190" r="3.5"/>
    <circle class="cel" cx="220" cy="164" r="9"/><line stroke="#004d40" stroke-width="2" x1="220" y1="173" x2="220" y2="190"/><circle class="knoop" cx="240" cy="190" r="3.5"/>
    <circle class="cel" cx="290" cy="164" r="9"/><line stroke="#004d40" stroke-width="2" x1="290" y1="173" x2="290" y2="190"/><circle class="knoop" cx="310" cy="190" r="3.5"/>

    <circle class="cel" cx="80" cy="224" r="9"/><line stroke="#004d40" stroke-width="2" x1="80" y1="233" x2="80" y2="250"/><circle class="knoop" cx="100" cy="250" r="3.5"/>
    <circle class="cel" cx="150" cy="224" r="9"/><line stroke="#004d40" stroke-width="2" x1="150" y1="233" x2="150" y2="250"/><circle class="knoop" cx="170" cy="250" r="3.5"/>
    <circle class="cel" cx="220" cy="224" r="9"/><line stroke="#004d40" stroke-width="2" x1="220" y1="233" x2="220" y2="250"/><circle class="knoop" cx="240" cy="250" r="3.5"/>
    <circle class="cel" cx="290" cy="224" r="9"/><line stroke="#004d40" stroke-width="2" x1="290" y1="233" x2="290" y2="250"/><circle class="knoop" cx="310" cy="250" r="3.5"/>
  </g>

  <!-- de aangesproken cel, op het kruispunt van rij B en kolom 2 -->
  <circle cx="170" cy="130" r="6" fill="#9e2f26"/>
  <circle cx="150" cy="104" r="15" fill="none" stroke="#9e2f26" stroke-width="2.5"/>

  <!-- rijlabels -->
  <text class="adres" x="357" y="76">A</text>
  <text class="adres" x="357" y="136">B</text>
  <text class="adres" x="357" y="196">C</text>
  <text class="adres" x="357" y="256">D</text>
  <text class="as" x="388" y="152">RAS</text>
  <text class="bij" x="388" y="174">rijadres</text>

  <!-- kolomlabels -->
  <text class="adres" x="100" y="307" text-anchor="middle">1</text>
  <text class="adres" x="170" y="307" text-anchor="middle">2</text>
  <text class="adres" x="240" y="307" text-anchor="middle">3</text>
  <text class="adres" x="310" y="307" text-anchor="middle">4</text>
  <text class="as" x="205" y="347" text-anchor="middle">CAS</text>
  <text class="bij" x="205" y="369" text-anchor="middle">kolomadres</text>
</svg>
