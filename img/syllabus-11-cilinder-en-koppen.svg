<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" width="780" height="500"
    font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="titel">
    <title id="titel">Vier platters op dezelfde as. Links de stapel schuin van boven, met een track op elke platter, een
        sector op de bovenste en de vier tracks samen als cilinder X. Rechts dezelfde stapel van opzij, met acht armen
        aan een blok en hun koppen op dezelfde track.</title>
    <rect width="780" height="500" fill="#ffffff" />

    <text x="10" y="18" font-size="12.5" fill="#555555">De stapel, schuin van boven gezien</text>
    <text x="452" y="18" font-size="12.5" fill="#555555">Dezelfde stapel van opzij</text>

    <line x1="440" y1="30" x2="440" y2="400" stroke="#004d40" stroke-width="0.8" stroke-opacity="0.25" />

    <!-- ============ links: de stapel schuin van boven ============ -->

    <!-- de as, waar de vier platters op zitten; hij is alleen in de tussenruimtes te zien -->
    <rect x="183" y="54" width="24" height="326" fill="#cfdad7" stroke="#9bb0ac" stroke-width="1" />
    <ellipse cx="195" cy="54" rx="12" ry="2.7" fill="#e0e7e5" stroke="#9bb0ac" stroke-width="1" />

    <!-- de cilinder: de vier tracks op dezelfde afstand van de as, als een wand door de stapel.
         Hij wordt voor de platters getekend, zodat elke platter hem afdekt waar hij eronder loopt. -->
    <path d="M 113 92 L 113 356 A 82 18.4 0 0 0 277 356 L 277 92 A 82 18.4 0 0 0 113 92 Z" fill="#004d40"
        fill-opacity="0.12" stroke="none" />
    <line x1="113" y1="92" x2="113" y2="356" stroke="#004d40" stroke-width="1" stroke-dasharray="4 3" />
    <line x1="277" y1="92" x2="277" y2="356" stroke="#004d40" stroke-width="1" stroke-dasharray="4 3" />

    <!-- de vier platters, van onder naar boven getekend zodat de bovenste de onderste afdekt -->
    <g stroke-width="1">
        <!-- platter 4 -->
        <ellipse cx="195" cy="362" rx="125" ry="28" fill="#cfdad7" stroke="#9bb0ac" />
        <rect x="70" y="356" width="250" height="6" fill="#cfdad7" stroke="none" />
        <line x1="70" y1="356" x2="70" y2="362" stroke="#9bb0ac" />
        <line x1="320" y1="356" x2="320" y2="362" stroke="#9bb0ac" />
        <ellipse cx="195" cy="356" rx="125" ry="28" fill="#e0e7e5" stroke="#9bb0ac" />
        <ellipse cx="195" cy="356" rx="104" ry="23.3" fill="none" stroke="#9bb0ac" stroke-width="0.6" />
        <ellipse cx="195" cy="356" rx="58" ry="13.0" fill="none" stroke="#9bb0ac" stroke-width="0.6" />
        <ellipse cx="195" cy="356" rx="82" ry="18.4" fill="none" stroke="#004d40" stroke-width="1.6" />

        <!-- platter 3 -->
        <ellipse cx="195" cy="274" rx="125" ry="28" fill="#cfdad7" stroke="#9bb0ac" />
        <rect x="70" y="268" width="250" height="6" fill="#cfdad7" stroke="none" />
        <line x1="70" y1="268" x2="70" y2="274" stroke="#9bb0ac" />
        <line x1="320" y1="268" x2="320" y2="274" stroke="#9bb0ac" />
        <ellipse cx="195" cy="268" rx="125" ry="28" fill="#e0e7e5" stroke="#9bb0ac" />
        <ellipse cx="195" cy="268" rx="104" ry="23.3" fill="none" stroke="#9bb0ac" stroke-width="0.6" />
        <ellipse cx="195" cy="268" rx="58" ry="13.0" fill="none" stroke="#9bb0ac" stroke-width="0.6" />
        <ellipse cx="195" cy="268" rx="82" ry="18.4" fill="none" stroke="#004d40" stroke-width="1.6" />

        <!-- platter 2 -->
        <ellipse cx="195" cy="186" rx="125" ry="28" fill="#cfdad7" stroke="#9bb0ac" />
        <rect x="70" y="180" width="250" height="6" fill="#cfdad7" stroke="none" />
        <line x1="70" y1="180" x2="70" y2="186" stroke="#9bb0ac" />
        <line x1="320" y1="180" x2="320" y2="186" stroke="#9bb0ac" />
        <ellipse cx="195" cy="180" rx="125" ry="28" fill="#e0e7e5" stroke="#9bb0ac" />
        <ellipse cx="195" cy="180" rx="104" ry="23.3" fill="none" stroke="#9bb0ac" stroke-width="0.6" />
        <ellipse cx="195" cy="180" rx="58" ry="13.0" fill="none" stroke="#9bb0ac" stroke-width="0.6" />
        <ellipse cx="195" cy="180" rx="82" ry="18.4" fill="none" stroke="#004d40" stroke-width="1.6" />

        <!-- platter 1 -->
        <ellipse cx="195" cy="98" rx="125" ry="28" fill="#cfdad7" stroke="#9bb0ac" />
        <rect x="70" y="92" width="250" height="6" fill="#cfdad7" stroke="none" />
        <line x1="70" y1="92" x2="70" y2="98" stroke="#9bb0ac" />
        <line x1="320" y1="92" x2="320" y2="98" stroke="#9bb0ac" />
        <ellipse cx="195" cy="92" rx="125" ry="28" fill="#e0e7e5" stroke="#9bb0ac" />
        <ellipse cx="195" cy="92" rx="104" ry="23.3" fill="none" stroke="#9bb0ac" stroke-width="0.6" />
        <ellipse cx="195" cy="92" rx="58" ry="13.0" fill="none" stroke="#9bb0ac" stroke-width="0.6" />
        <ellipse cx="195" cy="92" rx="82" ry="18.4" fill="none" stroke="#004d40" stroke-width="1.6" />
    </g>

    <!-- een sector: een stuk van de track op de bovenste platter -->
    <path d="M 236.0 76.1 A 82 18.4 0 0 1 272.1 85.7 L 258.9 86.8 A 68 15.26 0 0 0 229.0 78.8 Z" fill="#004d40"
        stroke="#00332b" stroke-width="0.8" />

    <!-- de aanwijzingen bij de linkerfiguur -->
    <g stroke="#555555" stroke-width="0.7" fill="none">
        <line x1="56" y1="222" x2="113" y2="92" />
        <line x1="56" y1="222" x2="113" y2="180" />
        <line x1="56" y1="222" x2="113" y2="268" />
        <line x1="56" y1="222" x2="113" y2="356" />
        <line x1="296" y1="56" x2="258" y2="80" />
        <line x1="178" y1="50" x2="188" y2="57" />
        <line x1="332" y1="240" x2="279" y2="228" />
        <line x1="332" y1="96" x2="320" y2="94" />
        <line x1="332" y1="184" x2="320" y2="182" />
        <line x1="332" y1="272" x2="320" y2="270" />
        <line x1="332" y1="360" x2="320" y2="358" />
    </g>
    <text x="10" y="226" font-size="13" fill="#222222">Track X</text>
    <text x="300" y="52" font-size="13" fill="#222222">Sector</text>
    <text x="152" y="46" font-size="13" fill="#222222">as</text>
    <text x="336" y="244" font-size="13" fill="#222222">Cilinder X</text>
    <text x="336" y="100" font-size="13" fill="#222222">Platter 1</text>
    <text x="336" y="188" font-size="13" fill="#222222">Platter 2</text>
    <text x="336" y="276" font-size="13" fill="#222222">Platter 3</text>
    <text x="336" y="364" font-size="13" fill="#222222">Platter 4</text>

    <!-- ============ rechts: dezelfde stapel van opzij ============ -->

    <!-- de cilinder loopt door de hele stapel, aan weerskanten van de as -->
    <line x1="578" y1="52" x2="578" y2="400" stroke="#004d40" stroke-width="1" stroke-dasharray="4 3" />
    <line x1="702" y1="52" x2="702" y2="400" stroke="#004d40" stroke-width="1" stroke-dasharray="4 3" />

    <!-- de as -->
    <rect x="634" y="54" width="12" height="326" fill="#e0e7e5" stroke="#9bb0ac" stroke-width="1" />

    <!-- de vier platters van opzij -->
    <g fill="#cfdad7" stroke="#9bb0ac" stroke-width="1">
        <rect x="545" y="92" width="190" height="7" />
        <rect x="545" y="180" width="190" height="7" />
        <rect x="545" y="268" width="190" height="7" />
        <rect x="545" y="356" width="190" height="7" />
    </g>

    <!-- het blok waar de acht armen aan vastzitten -->
    <rect x="462" y="60" width="18" height="332" rx="3" fill="#004d40" />

    <!-- de acht armen met hun kop, twee per platter: een boven en een onder elk oppervlak -->
    <g fill="#004d40">
        <polygon points="480,80 576,84 576,89 480,87" />
        <rect x="570" y="82" width="15" height="9" />
        <polygon points="480,111 576,106 576,101 480,103" />
        <rect x="570" y="100" width="15" height="9" />

        <polygon points="480,168 576,172 576,177 480,175" />
        <rect x="570" y="170" width="15" height="9" />
        <polygon points="480,199 576,194 576,189 480,191" />
        <rect x="570" y="188" width="15" height="9" />

        <polygon points="480,256 576,260 576,265 480,263" />
        <rect x="570" y="258" width="15" height="9" />
        <polygon points="480,287 576,282 576,277 480,279" />
        <rect x="570" y="276" width="15" height="9" />

        <polygon points="480,344 576,348 576,353 480,351" />
        <rect x="570" y="346" width="15" height="9" />
        <polygon points="480,375 576,370 576,365 480,367" />
        <rect x="570" y="364" width="15" height="9" />
    </g>

    <!-- de aanwijzingen bij de rechterfiguur -->
    <g stroke="#555555" stroke-width="0.7" fill="none">
        <line x1="498" y1="406" x2="520" y2="378" />
        <line x1="604" y1="406" x2="586" y2="374" />
        <line x1="606" y1="44" x2="576" y2="54" />
        <line x1="674" y1="44" x2="700" y2="54" />
    </g>
    <text x="480" y="420" font-size="13" fill="#222222">arm</text>
    <text x="596" y="420" font-size="13" fill="#222222">kop</text>
    <text x="640" y="40" font-size="13" fill="#222222" text-anchor="middle">Cilinder X</text>

    <!-- wat de figuur laat zien en de tekst ernaast zegt -->
    <text x="10" y="452" font-size="13" fill="#c0392b">Elke kant van elke platter heeft zijn eigen arm en kop. Omdat
        alle armen aan hetzelfde blok vastzitten,</text>
    <text x="10" y="470" font-size="13" fill="#c0392b">staan de acht koppen altijd op dezelfde track. Die acht tracks
        samen vormen cilinder X.</text>
</svg>
