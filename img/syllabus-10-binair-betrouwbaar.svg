<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="400" height="250"
     font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect width="400" height="250" fill="#ffffff"/>

    <!-- het gebied tussen de twee drempels: daar is de bit niet te herkennen -->
    <rect x="50" y="102" width="338" height="68" fill="#e0e7e5"/>

    <!-- de twee spanningsniveaus -->
    <line x1="50" y1="64" x2="388" y2="64" stroke="#222222" stroke-width="1.2"/>
    <line x1="50" y1="202" x2="388" y2="202" stroke="#222222" stroke-width="1.2"/>
    <text x="44" y="68" font-size="11" fill="#555555" text-anchor="end">5 V</text>
    <text x="44" y="206" font-size="11" fill="#555555" text-anchor="end">0 V</text>

    <!-- de grenzen van het fout-gebied -->
    <line x1="50" y1="102" x2="388" y2="102" stroke="#555555" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="50" y1="170" x2="388" y2="170" stroke="#555555" stroke-width="1" stroke-dasharray="3 3"/>

    <!-- de klokmomenten waarop de bit gelezen wordt -->
    <line x1="140" y1="20" x2="140" y2="218" stroke="#555555" stroke-width="1" stroke-dasharray="6 4"/>
    <line x1="240" y1="20" x2="240" y2="218" stroke="#555555" stroke-width="1" stroke-dasharray="6 4"/>
    <line x1="340" y1="20" x2="340" y2="218" stroke="#555555" stroke-width="1" stroke-dasharray="6 4"/>

    <!-- de kloktijd -->
    <text x="290" y="34" font-size="13" fill="#222222" text-anchor="middle" font-style="italic">t<tspan font-size="9" dy="3">c</tspan></text>
    <line x1="240" y1="44" x2="340" y2="44" stroke="#222222" stroke-width="1"/>
    <path d="M 240 44 l 8 -3.5 l 0 7 z" fill="#222222"/>
    <path d="M 340 44 l -8 -3.5 l 0 7 z" fill="#222222"/>

    <!-- het signaal: laag, hoog, laag -->
    <path d="M 50 192 C 92 191 142 187 176 185 C 190 184 196 92 216 85 L 268 85
             C 276 85 280 90 288 89 L 306 89 C 316 89 320 184 330 188
             C 346 192 364 190 388 190"
          fill="none" stroke="#004d40" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- de naam van het gebied -->
    <line x1="95" y1="128" x2="95" y2="112" stroke="#c0392b" stroke-width="1"/>
    <path d="M 95 104 l -3.5 8 l 7 0 z" fill="#c0392b"/>
    <text x="95" y="140" font-size="12" fill="#c0392b" text-anchor="middle">Fout-gebied</text>
    <line x1="95" y1="145" x2="95" y2="158" stroke="#c0392b" stroke-width="1"/>
    <path d="M 95 166 l -3.5 -8 l 7 0 z" fill="#c0392b"/>

    <!-- de bit die op elk klokmoment gelezen wordt -->
    <text x="140" y="234" font-size="13" fill="#222222" text-anchor="middle">0</text>
    <text x="240" y="234" font-size="13" fill="#222222" text-anchor="middle">1</text>
    <text x="340" y="234" font-size="13" fill="#222222" text-anchor="middle">0</text>
</svg>
