<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410" width="720" height="410"
    font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="titel">
    <title id="titel">Het journaal: van het werkgeheugen eerst naar een aaneengesloten stuk schijf, en daarna naar
        de uiteindelijke plaats</title>
    <rect width="720" height="410" fill="#ffffff" />

    <defs>
        <marker id="pijl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
            <path d="M0 0 L10 5 L0 10 z" fill="#004d40" />
        </marker>
    </defs>

    <!-- processor en cache, boven de bus -->
    <circle cx="96" cy="52" r="30" fill="#f5f7f7" stroke="#9bb0ac" />
    <text x="96" y="57" font-size="13" fill="#222" text-anchor="middle">CPU</text>

    <rect x="176" y="30" width="96" height="44" fill="#f5f7f7" stroke="#9bb0ac" />
    <text x="224" y="57" font-size="13" fill="#222" text-anchor="middle">cache</text>

    <path d="M96 82 L96 118" stroke="#9bb0ac" stroke-width="2" fill="none" />
    <path d="M126 52 L176 52" stroke="#9bb0ac" stroke-width="2" fill="none" />

    <!-- de bus, van de processor tot aan de schijf -->
    <path d="M40 118 L514 118" stroke="#222222" stroke-width="3" fill="none" />
    <text x="40" y="110" font-size="13" fill="#222">bus</text>
    <path d="M300 118 L300 156" stroke="#9bb0ac" stroke-width="2" fill="none" />

    <!-- het werkgeheugen: het groene blok waar de tekst naar verwijst -->
    <rect x="176" y="156" width="248" height="70" fill="#b2dfdb" stroke="#004d40" stroke-width="2" />
    <text x="300" y="182" font-size="14" fill="#00332b" text-anchor="middle">Main Memory (RAM)</text>
    <text x="300" y="202" font-size="12" fill="#33564f" text-anchor="middle">hier bewerk je het videobestand</text>
    <rect x="212" y="208" width="176" height="10" fill="#004d40" />

    <!-- de schijf -->
    <text x="600" y="52" font-size="14" fill="#222" text-anchor="middle">schijf</text>
    <path d="M514 96 L514 286" stroke="#9bb0ac" fill="none" />
    <path d="M686 96 L686 286" stroke="#9bb0ac" fill="none" />
    <path d="M514 286 A86 20 0 0 0 686 286" stroke="#9bb0ac" fill="none" />
    <ellipse cx="600" cy="96" rx="86" ry="20" fill="#f5f7f7" stroke="#9bb0ac" />

    <!-- het journaal op de schijf: één aaneengesloten stuk -->
    <rect x="528" y="122" width="144" height="52" fill="#b2dfdb" stroke="#004d40" stroke-width="2" />
    <text x="600" y="144" font-size="13" fill="#00332b" text-anchor="middle">journaal</text>
    <g fill="#004d40">
        <rect x="540" y="152" width="28" height="10" />
        <rect x="572" y="152" width="28" height="10" />
        <rect x="604" y="152" width="28" height="10" />
        <rect x="636" y="152" width="28" height="10" />
    </g>

    <!-- de uiteindelijke plaats: verspreid over sectoren -->
    <rect x="528" y="206" width="144" height="60" fill="#f5f7f7" stroke="#9bb0ac" />
    <text x="600" y="226" font-size="13" fill="#222" text-anchor="middle">het bestand zelf</text>
    <text x="600" y="242" font-size="11" fill="#555" text-anchor="middle">verspreid over sectoren</text>
    <g fill="#9bb0ac">
        <rect x="538" y="248" width="20" height="10" />
        <rect x="576" y="248" width="20" height="10" />
        <rect x="608" y="248" width="20" height="10" />
        <rect x="648" y="248" width="20" height="10" />
    </g>

    <!-- pijl 1: van het werkgeheugen naar het journaal -->
    <path d="M430 188 L522 150" stroke="#004d40" stroke-width="2" fill="none" marker-end="url(#pijl)" />
    <text x="472" y="158" font-size="12" fill="#004d40" text-anchor="middle">1</text>

    <!-- pijl 2: van het journaal naar de uiteindelijke plaats -->
    <path d="M600 180 L600 202" stroke="#004d40" stroke-width="2" fill="none" marker-end="url(#pijl)" />
    <text x="612" y="197" font-size="12" fill="#004d40">2</text>

    <text x="40" y="326" font-size="13" fill="#222"><tspan font-weight="600">1.</tspan> Het schrijven gaat eerst naar
        het journaal. Daar staat alles achter elkaar, dus dat gaat snel.</text>
    <text x="40" y="348" font-size="13" fill="#222"><tspan font-weight="600">2.</tspan> Zodra de schijf niet
        ondervraagd wordt, komen de gegevens op hun uiteindelijke plaats terecht.</text>

    <path d="M40 364 L680 364" stroke="#e9ecef" stroke-width="1" />

    <text x="40" y="386" font-size="13" fill="#c0392b">Valt de stroom uit tussen 1 en 2, dan ziet het
        bestandssysteem dat het journaal en het bestand niet</text>
    <text x="40" y="404" font-size="13" fill="#c0392b">overeenkomen, en kan het ingrijpen en corrigeren.</text>
</svg>
