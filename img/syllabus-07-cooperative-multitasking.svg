<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 770 156" width="770" height="156"
    font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="titel">
    <title id="titel">Cooperative multitasking: proces 1 houdt de processor bezet tot het zelf afgeeft, en pas dan
        komt proces 2 aan de beurt</title>
    <rect width="770" height="156" fill="#ffffff" />

    <defs>
        <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#004d40" />
        </marker>
    </defs>

    <text x="15" y="24" font-size="17" fill="#00332b" font-weight="bold">Cooperative</text>

    <rect x="15" y="50" width="130" height="28" fill="#e0e7e5" stroke="#004d40" />
    <text x="80" y="69" font-size="14" fill="#00332b" text-anchor="middle">Proces 1</text>
    <rect x="15" y="90" width="130" height="28" fill="#e0e7e5" stroke="#004d40" />
    <text x="80" y="109" font-size="14" fill="#00332b" text-anchor="middle">Proces 2</text>

    <path d="M 148 64 L 268 64" stroke="#004d40" stroke-width="2" fill="none" marker-end="url(#p)" />
    <path d="M 148 104 L 268 104" stroke="#004d40" stroke-width="2" fill="none" marker-end="url(#p)" />

    <rect x="272" y="50" width="476" height="28" fill="#ffffff" stroke="#d5dedc" />
    <rect x="272" y="90" width="476" height="28" fill="#ffffff" stroke="#d5dedc" />

    <rect x="274" y="52" width="335" height="24" fill="#004d40" />
    <rect x="614" y="92" width="132" height="24" fill="#b2dfdb" stroke="#004d40" />

    <path d="M 611 42 L 611 126" stroke="#004d40" stroke-width="2" stroke-dasharray="5 4" fill="none" />
    <text x="611" y="144" font-size="13" fill="#004d40" text-anchor="middle">proces 1 geeft zelf af</text>
</svg>
