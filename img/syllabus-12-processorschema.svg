<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 428" width="740" height="428"
    font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="titel">
    <title id="titel">Het schema van een processor: invoer links, uitvoer rechts, binnen de processor de control unit,
        de arithmetic and logic unit en het geheugen met de registers en de cache, en daaronder eerst het werkgeheugen
        en dan de opslag</title>
    <rect width="740" height="428" fill="#ffffff" />

    <defs>
        <marker id="punt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#004d40" />
        </marker>
        <marker id="punt-terug" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#004d40" />
        </marker>
    </defs>

    <!-- de processor zelf -->
    <rect x="175" y="6" width="390" height="250" fill="#e0e7e5" stroke="#9bb0ac" />
    <text x="370" y="32" font-size="15" fill="#00332b" text-anchor="middle">Central Processing Unit (CPU)</text>

    <rect x="195" y="44" width="170" height="76" fill="#004d40" stroke="#004d40" />
    <text x="280" y="76" font-size="14" fill="#ffffff" text-anchor="middle">Control Unit</text>
    <text x="280" y="98" font-size="14" fill="#ffffff" text-anchor="middle">(CU)</text>

    <rect x="375" y="44" width="170" height="76" fill="#004d40" stroke="#004d40" />
    <text x="460" y="74" font-size="12" fill="#ffffff" text-anchor="middle">Arithmetic and Logic Unit</text>
    <text x="460" y="98" font-size="14" fill="#ffffff" text-anchor="middle">(ALU)</text>

    <!-- het geheugen binnen de processor -->
    <rect x="195" y="136" width="350" height="104" fill="#b2dfdb" stroke="#004d40" />
    <text x="370" y="159" font-size="14" fill="#00332b" text-anchor="middle">Geheugen</text>

    <rect x="210" y="170" width="155" height="54" fill="#ffffff" stroke="#004d40" />
    <text x="287" y="203" font-size="14" fill="#00332b" text-anchor="middle">Registers</text>

    <rect x="375" y="170" width="155" height="54" fill="#ffffff" stroke="#004d40" />
    <text x="452" y="203" font-size="14" fill="#00332b" text-anchor="middle">Cache</text>

    <!-- invoer links en uitvoer rechts -->
    <rect x="15" y="101" width="130" height="60" fill="#b2dfdb" stroke="#004d40" />
    <text x="80" y="137" font-size="15" fill="#00332b" text-anchor="middle">INVOER</text>

    <rect x="595" y="101" width="130" height="60" fill="#b2dfdb" stroke="#004d40" />
    <text x="660" y="137" font-size="15" fill="#00332b" text-anchor="middle">UITVOER</text>

    <path d="M 149 131 L 167 131" stroke="#004d40" stroke-width="2" fill="none" marker-end="url(#punt)" />
    <path d="M 569 131 L 591 131" stroke="#004d40" stroke-width="2" fill="none" marker-end="url(#punt)" />

    <!-- het werkgeheugen onder de processor -->
    <path d="M 370 258 L 370 292" stroke="#004d40" stroke-width="2" fill="none" marker-start="url(#punt-terug)"
        marker-end="url(#punt)" />

    <rect x="190" y="294" width="360" height="44" fill="#b2dfdb" stroke="#004d40" />
    <text x="370" y="322" font-size="15" fill="#00332b" text-anchor="middle">WERKGEHEUGEN</text>

    <!-- de opslag onder het werkgeheugen -->
    <path d="M 370 340 L 370 374" stroke="#004d40" stroke-width="2" fill="none" marker-start="url(#punt-terug)"
        marker-end="url(#punt)" />

    <rect x="190" y="376" width="360" height="44" fill="#b2dfdb" stroke="#004d40" />
    <text x="370" y="404" font-size="15" fill="#00332b" text-anchor="middle">OPSLAG</text>
</svg>
