    <line x1="92" y1="73.7" x2="159.1" y2="73.7" stroke="#c0392b" stroke-width="1" stroke-dasharray="4 3"/>
    <line x1="92" y1="188.6" x2="612.0" y2="188.6" stroke="#c0392b" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="164.7" y="65.7" font-size="12" fill="#c0392b">zo'n 130 MB/s aan de buitenrand</text>
    <text x="332.4" y="180.6" font-size="12" fill="#c0392b">de helft daarvan bij de as</text>

    <text x="92" y="48" font-size="12" fill="#555555">Elke trede is een zone: binnen een zone blijft de snelheid gelijk</text>

    <text x="97.6" y="358" font-size="11" fill="#555555">buitenrand</text>
    <text x="606.4" y="358" font-size="11" fill="#555555" text-anchor="end">as</text>
    <line x1="142.3" y1="354" x2="561.7" y2="354" stroke="#555555" stroke-width="0.8"/>
    <path d="M 561.7 354 l -8 -3 l 0 6 z" fill="#555555"/>
