    <text x="352.0" y="340" font-size="12" fill="#222222" text-anchor="middle">Positie op de schijf (GB)</text>

    <!-- de meting: elke trede is een zone -->
    <path d="M 92.0 73.7 L 92.0 73.7 L 126.7 73.7 L 126.7 77.0 L 161.3 77.0 L 161.3 82.0 L 196.0 82.0 L 196.0 88.1 L 230.7 88.1 L 230.7 94.9 L 265.3 94.9 L 265.3 102.3 L 300.0 102.3 L 300.0 110.3 L 334.7 110.3 L 334.7 118.8 L 369.3 118.8 L 369.3 127.7 L 404.0 127.7 L 404.0 137.0 L 438.7 137.0 L 438.7 146.6 L 473.3 146.6 L 473.3 156.7 L 508.0 156.7 L 508.0 167.0 L 542.7 167.0 L 542.7 177.6 L 577.3 177.6 L 577.3 188.6 L 612.0 188.6" fill="none" stroke="#004d40" stroke-width="2.2"/>

