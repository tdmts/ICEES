<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" width="720" height="270"
    font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="titel">
    <title id="titel">Drie primaire partities naast een extended partitie met logische partities erin</title>
    <rect width="720" height="270" fill="#ffffff" />

    <!-- de vier tabelplaatsen -->
    <text x="40" y="30" font-size="13" fill="#004d40">De vier plaatsen in de partitietabel</text>

    <rect x="40" y="40" width="150" height="32" fill="#b2dfdb" stroke="#004d40" />
    <rect x="190" y="40" width="120" height="32" fill="#b2dfdb" stroke="#004d40" />
    <rect x="310" y="40" width="120" height="32" fill="#b2dfdb" stroke="#004d40" />
    <rect x="430" y="40" width="250" height="32" fill="#b2dfdb" stroke="#004d40" />
    <text x="115" y="61" font-size="13" fill="#00332b" text-anchor="middle">1</text>
    <text x="250" y="61" font-size="13" fill="#00332b" text-anchor="middle">2</text>
    <text x="370" y="61" font-size="13" fill="#00332b" text-anchor="middle">3</text>
    <text x="555" y="61" font-size="13" fill="#00332b" text-anchor="middle">4</text>

    <path d="M115 72 L115 96 M250 72 L250 96 M370 72 L370 96 M555 72 L555 90" stroke="#9bb0ac" stroke-width="1"
        fill="none" />

    <!-- de schijf -->
    <rect x="40" y="96" width="150" height="58" fill="#e0e7e5" stroke="#9bb0ac" />
    <rect x="190" y="96" width="120" height="58" fill="#e0e7e5" stroke="#9bb0ac" />
    <rect x="310" y="96" width="120" height="58" fill="#e0e7e5" stroke="#9bb0ac" />
    <text x="115" y="122" font-size="14" fill="#222" text-anchor="middle">primair</text>
    <text x="250" y="122" font-size="14" fill="#222" text-anchor="middle">primair</text>
    <text x="370" y="122" font-size="14" fill="#222" text-anchor="middle">primair</text>
    <text x="115" y="142" font-size="12" fill="#555" text-anchor="middle">bestandssysteem</text>
    <text x="250" y="142" font-size="12" fill="#555" text-anchor="middle">bestandssysteem</text>
    <text x="370" y="142" font-size="12" fill="#555" text-anchor="middle">bestandssysteem</text>

    <!-- extended met logische erin -->
    <rect x="430" y="90" width="250" height="70" fill="#ffffff" stroke="#004d40" stroke-width="2" />
    <text x="555" y="106" font-size="12" fill="#004d40" text-anchor="middle">extended, zonder bestandssysteem</text>

    <rect x="440" y="114" width="72" height="38" fill="#e0e7e5" stroke="#9bb0ac" />
    <rect x="519" y="114" width="72" height="38" fill="#e0e7e5" stroke="#9bb0ac" />
    <rect x="598" y="114" width="72" height="38" fill="#e0e7e5" stroke="#9bb0ac" />
    <text x="476" y="138" font-size="12" fill="#222" text-anchor="middle">logisch</text>
    <text x="555" y="138" font-size="12" fill="#222" text-anchor="middle">logisch</text>
    <text x="634" y="138" font-size="12" fill="#222" text-anchor="middle">logisch</text>

    <text x="40" y="196" font-size="13" fill="#222">De extended partitie neemt een van de vier plaatsen in en draagt
        zelf geen bestandssysteem.</text>
    <text x="40" y="216" font-size="13" fill="#222">Ze is een houder: haar logische partities houdt ze zelf bij, en
        daarvan mogen er zoveel zijn</text>
    <text x="40" y="236" font-size="13" fill="#222">als je nodig hebt.</text>
</svg>
