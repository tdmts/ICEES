<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" width="780" height="430"
    font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="titel">
    <title id="titel">De drie statussen van een proces: ready, running en blocked, met de overgangen ertussen en de
        overgang van blocked naar running die niet bestaat</title>
    <rect width="780" height="430" fill="#ffffff" />

    <defs>
        <marker id="punt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#004d40" />
        </marker>
        <marker id="punt-rood" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b" />
        </marker>
    </defs>

    <!-- starten van een proces -->
    <rect x="12" y="106" width="118" height="64" fill="#ffffff" stroke="#9bb0ac" />
    <text x="71" y="132" font-size="14" fill="#222" text-anchor="middle">starten van</text>
    <text x="71" y="152" font-size="14" fill="#222" text-anchor="middle">een proces</text>
    <path d="M 134 138 L 158 138" stroke="#004d40" stroke-width="2" fill="none" marker-end="url(#punt)" />

    <!-- ready: een wachtrij, dus een stapel -->
    <rect x="186" y="64" width="140" height="105" fill="#e0e7e5" stroke="#004d40" />
    <rect x="179" y="71" width="140" height="105" fill="#e0e7e5" stroke="#004d40" />
    <rect x="172" y="78" width="140" height="105" fill="#e0e7e5" stroke="#004d40" />
    <rect x="165" y="85" width="140" height="105" fill="#b2dfdb" stroke="#004d40" />
    <text x="235" y="144" font-size="17" fill="#00332b" text-anchor="middle">ready</text>

    <!-- running -->
    <rect x="470" y="85" width="140" height="105" fill="#004d40" stroke="#004d40" />
    <text x="540" y="144" font-size="17" fill="#ffffff" text-anchor="middle">running</text>

    <!-- blocked -->
    <rect x="470" y="290" width="140" height="95" fill="#e0e7e5" stroke="#004d40" />
    <text x="540" y="344" font-size="17" fill="#00332b" text-anchor="middle">blocked</text>

    <!-- beeindigen van een proces -->
    <rect x="650" y="106" width="118" height="64" fill="#ffffff" stroke="#9bb0ac" />
    <text x="709" y="132" font-size="14" fill="#222" text-anchor="middle">beëindigen van</text>
    <text x="709" y="152" font-size="14" fill="#222" text-anchor="middle">een proces</text>
    <path d="M 614 138 L 646 138" stroke="#004d40" stroke-width="2" fill="none" marker-end="url(#punt)" />

    <!-- ready naar running en terug -->
    <path d="M 333 118 L 466 118" stroke="#004d40" stroke-width="2" fill="none" marker-end="url(#punt)" />
    <text x="399" y="107" font-size="13" fill="#004d40" text-anchor="middle">de scheduler kiest</text>
    <path d="M 466 162 L 310 162" stroke="#004d40" stroke-width="2" fill="none" marker-end="url(#punt)" />
    <text x="392" y="182" font-size="13" fill="#004d40" text-anchor="middle">CPU slice op</text>

    <!-- running naar blocked -->
    <path d="M 505 194 L 505 286" stroke="#004d40" stroke-width="2" fill="none" marker-end="url(#punt)" />
    <text x="493" y="246" font-size="13" fill="#004d40" text-anchor="end">wacht op I/O</text>

    <!-- blocked naar running kan niet -->
    <path d="M 575 286 L 575 194" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 5" fill="none"
        marker-end="url(#punt-rood)" />
    <path d="M 566 231 L 584 249 M 584 231 L 566 249" stroke="#c0392b" stroke-width="3" fill="none" />
    <text x="592" y="245" font-size="13" fill="#c0392b" text-anchor="start">kan niet</text>

    <!-- blocked naar ready -->
    <path d="M 466 337 C 340 337, 250 320, 235 197" stroke="#004d40" stroke-width="2" fill="none"
        marker-end="url(#punt)" />
    <text x="322" y="292" font-size="13" fill="#004d40" text-anchor="middle">I/O klaar</text>
</svg>
