<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 610" width="760" height="610" role="img">
  <style>
    text { font-family: "Segoe UI", Helvetica, Arial, sans-serif; fill: #222; }
    .chip { fill: #004d40; }
    .chiptekst { fill: #ffffff; }
    .titel { font-size: 20px; font-weight: 600; }
    .ondertitel { font-size: 13px; }
    .label { font-size: 14px; }
    .klein { font-size: 13px; }
    .bus { font-size: 14px; font-style: italic; }
    .kader { font-size: 14px; font-weight: 600; fill: #004d40; }
    .lijn { stroke: #222; stroke-width: 2.5; fill: none; }
    .dun { stroke: #222; stroke-width: 1.6; fill: none; }
    .slot { fill: #b2dfdb; stroke: #004d40; stroke-width: 1.5; }
    .omtrek { fill: none; stroke: #004d40; stroke-width: 1.6; stroke-dasharray: 7 5; }
  </style>
  <rect x="0" y="0" width="760" height="610" fill="#ffffff"/>

  <!-- chipset-omtrek -->
  <rect class="omtrek" x="255" y="150" width="275" height="308"/>
  <text class="kader" x="264" y="170">Chipset</text>

  <!-- processor -->
  <rect class="chip" x="320" y="25" width="140" height="62" rx="8"/>
  <text class="titel chiptekst" x="390" y="55" text-anchor="middle">Processor</text>
  <text class="ondertitel chiptekst" x="390" y="74" text-anchor="middle">(CPU)</text>

  <!-- klokgenerator -->
  <rect class="chip" x="150" y="100" width="110" height="44" rx="8"/>
  <text class="klein chiptekst" x="205" y="127" text-anchor="middle">Klokgenerator</text>
  <path class="dun" stroke-dasharray="6 4" d="M260 122 H390"/>

  <!-- front side bus -->
  <path class="lijn" d="M390 87 V178"/>
  <text class="bus" x="402" y="106">Front Side Bus</text>

  <!-- northbridge -->
  <rect class="chip" x="270" y="178" width="240" height="80" rx="8"/>
  <text class="titel chiptekst" x="390" y="212" text-anchor="middle">Northbridge</text>
  <text class="ondertitel chiptekst" x="390" y="234" text-anchor="middle">(geheugencontroller)</text>

  <!-- grafische kaart, links van de northbridge -->
  <rect class="slot" x="28" y="188" width="16" height="60"/>
  <path class="lijn" d="M44 218 H270"/>
  <text class="bus" x="160" y="192" text-anchor="middle">Snelle grafische bus</text>
  <text class="bus" x="160" y="208" text-anchor="middle">(AGP of PCI Express)</text>
  <text class="label" x="15" y="270">Slot voor de</text>
  <text class="label" x="15" y="286">grafische kaart</text>

  <!-- geheugensloten, rechts van de northbridge -->
  <path class="lijn" d="M510 218 H636"/>
  <rect class="slot" x="640" y="182" width="12" height="72"/>
  <rect class="slot" x="657" y="182" width="12" height="72"/>
  <rect class="slot" x="674" y="182" width="12" height="72"/>
  <rect class="slot" x="691" y="182" width="12" height="72"/>
  <text class="bus" x="573" y="208" text-anchor="middle">Geheugenbus</text>
  <text class="label" x="671" y="274" text-anchor="middle">Geheugensloten</text>

  <!-- interne bus -->
  <path class="lijn" d="M390 258 V330"/>
  <text class="bus" x="402" y="298">Interne bus</text>

  <!-- southbridge -->
  <rect class="chip" x="270" y="330" width="240" height="120" rx="8"/>
  <text class="titel chiptekst" x="390" y="358" text-anchor="middle">Southbridge</text>
  <text class="ondertitel chiptekst" x="390" y="377" text-anchor="middle">(I/O-controller)</text>
  <text class="klein chiptekst" x="288" y="401">IDE</text>
  <text class="klein chiptekst" x="288" y="418">SATA</text>
  <text class="klein chiptekst" x="288" y="435">USB</text>
  <text class="klein chiptekst" x="372" y="401">Ethernet</text>
  <text class="klein chiptekst" x="372" y="418">audiocodec</text>
  <text class="klein chiptekst" x="372" y="435">CMOS-geheugen</text>

  <!-- pci, links van de southbridge -->
  <rect class="slot" x="20" y="340" width="14" height="64"/>
  <rect class="slot" x="39" y="340" width="14" height="64"/>
  <rect class="slot" x="58" y="340" width="14" height="64"/>
  <path class="lijn" d="M72 372 H270"/>
  <text class="bus" x="172" y="362" text-anchor="middle">PCI-bus</text>
  <text class="label" x="46" y="424" text-anchor="middle">PCI-sloten</text>

  <!-- kabels en poorten naar buiten -->
  <path class="dun" d="M510 372 L700 344"/>
  <path class="dun" d="M510 384 L700 370"/>
  <path class="dun" d="M510 396 L700 396"/>
  <path class="dun" d="M510 408 L700 422"/>
  <path class="dun" d="M510 420 L700 448"/>
  <path class="dun" d="M510 432 L700 474"/>
  <text class="label" x="612" y="308">Kabels en poorten</text>
  <text class="label" x="612" y="324">naar buiten</text>

  <!-- lpc-bus -->
  <path class="lijn" d="M330 450 V496 M225 496 H430 M225 496 V518 M430 496 V513"/>
  <text class="bus" x="338" y="482">LPC-bus</text>

  <!-- flash rom en super i/o -->
  <rect class="chip" x="150" y="518" width="150" height="52" rx="8"/>
  <text class="ondertitel chiptekst" x="225" y="540" text-anchor="middle">Flash ROM</text>
  <text class="ondertitel chiptekst" x="225" y="558" text-anchor="middle">(BIOS)</text>

  <rect class="chip" x="355" y="513" width="150" height="62" rx="8"/>
  <text class="titel chiptekst" x="430" y="551" text-anchor="middle">Super I/O</text>

  <path class="dun" d="M505 544 L525 506"/>
  <path class="dun" d="M505 544 L525 525"/>
  <path class="dun" d="M505 544 L525 544"/>
  <path class="dun" d="M505 544 L525 563"/>
  <path class="dun" d="M505 544 L525 582"/>
  <text class="klein" x="530" y="510">seriële poort</text>
  <text class="klein" x="530" y="529">parallelle poort</text>
  <text class="klein" x="530" y="548">diskettestation</text>
  <text class="klein" x="530" y="567">toetsenbord</text>
  <text class="klein" x="530" y="586">muis</text>
</svg>
