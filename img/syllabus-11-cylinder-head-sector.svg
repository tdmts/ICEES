<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420" width="620" height="420" role="img">
  <style>
    text { font-family: "Segoe UI", Helvetica, Arial, sans-serif; fill: #222222; }
    .lab { font-size: 16px; }
    .draad { stroke: #9bb0ac; stroke-width: 1.5; fill: none; }
    .track { stroke: #9bb0ac; stroke-width: 1.2; fill: none; }
  </style>
  <rect x="0" y="0" width="620" height="420" fill="#ffffff"/>

  <!-- de plaat -->
  <circle cx="200" cy="205" r="185" fill="#f5f7f7" stroke="#004d40" stroke-width="2"/>

  <!-- de tracks: concentrische cirkels -->
  <circle class="track" cx="200" cy="205" r="50"/>
  <circle class="track" cx="200" cy="205" r="65"/>
  <circle class="track" cx="200" cy="205" r="80"/>
  <circle class="track" cx="200" cy="205" r="95"/>
  <circle class="track" cx="200" cy="205" r="110"/>
  <circle class="track" cx="200" cy="205" r="125"/>
  <circle class="track" cx="200" cy="205" r="140"/>
  <circle class="track" cx="200" cy="205" r="155"/>
  <circle class="track" cx="200" cy="205" r="170"/>

  <!-- acht radialen: elke track wordt in even veel sectoren verdeeld -->
  <path class="track" d="M 232,205 L 385,205 M 168,205 L 15,205 M 200,237 L 200,390 M 200,173 L 200,20"/>
  <path class="track" d="M 222.6,182.4 L 330.8,74.2 M 177.4,227.6 L 69.2,335.8 M 222.6,227.6 L 330.8,335.8 M 177.4,182.4 L 69.2,74.2"/>

  <!-- een sector buitenaan en een sector binnenaan, allebei 512 byte -->
  <path fill="#004d40" d="M 320.2,84.8 A 170,170 0 0 1 385,205 L 355,205 A 155,155 0 0 0 309.6,95.4 Z"/>
  <path fill="#004d40" d="M 256.6,148.4 A 80,80 0 0 1 280,205 L 265,205 A 65,65 0 0 0 245.96,159.04 Z"/>

  <!-- de as in het midden -->
  <circle cx="200" cy="205" r="32" fill="#cfdad7" stroke="#004d40" stroke-width="2"/>
  <circle cx="200" cy="205" r="9" fill="#004d40"/>

  <path class="draad" d="M 409,115 L 350,143"/>
  <circle cx="350" cy="143" r="2.5" fill="#ffffff"/>
  <text class="lab" x="415" y="120">sector van 512 byte</text>

  <path class="draad" d="M 409,295 L 267,177"/>
  <circle cx="267" cy="177" r="2.5" fill="#ffffff"/>
  <text class="lab" x="415" y="300">sector van 512 byte</text>
</svg>
