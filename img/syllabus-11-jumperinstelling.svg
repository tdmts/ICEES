<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400" role="img">
  <style>
    text { font-family: "Segoe UI", Helvetica, Arial, sans-serif; fill: #222222; }
    .titel { font-size: 17px; font-weight: 700; fill: #004d40; }
    .lab { font-size: 16px; }
    .pen { font-size: 15px; font-weight: 600; fill: #004d40; }
    .kader { font-size: 13px; fill: #555555; }
    .rand { stroke: #004d40; stroke-width: 1.8; }
  </style>
  <rect x="0" y="0" width="500" height="400" fill="#ffffff"/>

  <text class="titel" x="250" y="26" text-anchor="middle">Jumperinstelling</text>

  <!-- drie standen, met telkens de plaats van het jumpertje -->
  <rect class="rand" x="20" y="40" width="460" height="156" fill="#f5f7f7"/>
  <path class="rand" d="M 20,92 L 480,92 M 20,144 L 480,144 M 170,40 L 170,196"/>

  <!-- Master: jumpertje op A en B -->
  <rect x="49" y="49" width="17" height="34" rx="3" fill="#004d40"/>
  <g fill="#ffffff" stroke="#004d40" stroke-width="1.5">
    <rect x="52" y="52" width="11" height="11"/><rect x="52" y="69" width="11" height="11"/>
    <rect x="82" y="52" width="11" height="11"/><rect x="82" y="69" width="11" height="11"/>
    <rect x="112" y="52" width="11" height="11"/><rect x="112" y="69" width="11" height="11"/>
    <rect x="142" y="52" width="11" height="11"/><rect x="142" y="69" width="11" height="11"/>
  </g>
  <text class="lab" x="188" y="72">Master: jumpertje op A en B</text>

  <!-- Slave: geen jumpertje -->
  <g fill="#ffffff" stroke="#004d40" stroke-width="1.5">
    <rect x="52" y="104" width="11" height="11"/><rect x="52" y="121" width="11" height="11"/>
    <rect x="82" y="104" width="11" height="11"/><rect x="82" y="121" width="11" height="11"/>
    <rect x="112" y="104" width="11" height="11"/><rect x="112" y="121" width="11" height="11"/>
    <rect x="142" y="104" width="11" height="11"/><rect x="142" y="121" width="11" height="11"/>
  </g>
  <text class="lab" x="188" y="124">Slave: geen jumpertje</text>

  <!-- Cable select: jumpertje op E en F -->
  <rect x="109" y="153" width="17" height="34" rx="3" fill="#004d40"/>
  <g fill="#ffffff" stroke="#004d40" stroke-width="1.5">
    <rect x="52" y="156" width="11" height="11"/><rect x="52" y="173" width="11" height="11"/>
    <rect x="82" y="156" width="11" height="11"/><rect x="82" y="173" width="11" height="11"/>
    <rect x="112" y="156" width="11" height="11"/><rect x="112" y="173" width="11" height="11"/>
    <rect x="142" y="156" width="11" height="11"/><rect x="142" y="173" width="11" height="11"/>
  </g>
  <text class="lab" x="188" y="176">Cable select: jumpertje op E en F</text>

  <!-- de achterkant van de schijf, waar die pennen zitten -->
  <text class="kader" x="250" y="240" text-anchor="middle">achterkant van de harde schijf</text>
  <rect class="rand" x="40" y="252" width="420" height="120" rx="4" fill="#f5f7f7"/>

  <text class="pen" x="72" y="278">B</text>
  <text class="pen" x="102" y="278">D</text>
  <text class="pen" x="132" y="278">F</text>
  <text class="pen" x="162" y="278">H</text>

  <rect x="60" y="286" width="120" height="52" rx="3" fill="#cfdad7" stroke="#004d40" stroke-width="1.8"/>
  <g fill="#ffffff" stroke="#004d40" stroke-width="1.5">
    <rect x="68" y="294" width="11" height="11"/><rect x="68" y="315" width="11" height="11"/>
    <rect x="98" y="294" width="11" height="11"/><rect x="98" y="315" width="11" height="11"/>
    <rect x="128" y="294" width="11" height="11"/><rect x="128" y="315" width="11" height="11"/>
    <rect x="158" y="294" width="11" height="11"/><rect x="158" y="315" width="11" height="11"/>
  </g>

  <text class="pen" x="72" y="360">A</text>
  <text class="pen" x="102" y="360">C</text>
  <text class="pen" x="132" y="360">E</text>
  <text class="pen" x="162" y="360">G</text>

  <rect x="220" y="286" width="200" height="52" rx="3" fill="#e0e7e5" stroke="#004d40" stroke-width="1.8"/>
  <ellipse cx="252" cy="312" rx="14" ry="17" fill="#ffffff" stroke="#004d40" stroke-width="1.5"/>
  <ellipse cx="298" cy="312" rx="14" ry="17" fill="#ffffff" stroke="#004d40" stroke-width="1.5"/>
  <ellipse cx="344" cy="312" rx="14" ry="17" fill="#ffffff" stroke="#004d40" stroke-width="1.5"/>
  <ellipse cx="390" cy="312" rx="14" ry="17" fill="#ffffff" stroke="#004d40" stroke-width="1.5"/>
</svg>
