    <circle cx="212" cy="246" r="156.0" fill="none" stroke="#3f7238" stroke-width="1.5"/>
    <circle cx="212" cy="246" r="156.0" fill="none" stroke="#6b6b6b" stroke-width="1.5"/>
    <circle cx="212" cy="246" r="175.0" fill="none" stroke="#6b6b6b" stroke-width="0.7"/>
    <circle cx="212" cy="246" r="194.0" fill="none" stroke="#6b6b6b" stroke-width="1.5"/>

