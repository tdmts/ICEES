    <!-- een sector in de binnenste en een in de buitenste zone, allebei vanaf twaalf uur -->
    <path d="M 212.0 166.7 A 79.33333333333333 79.33333333333333 0 0 1 268.1 189.9 L 257.3 200.7 A 64 64 0 0 0 212.0 182.0 Z" fill="#9e2f26" stroke="#7d2119" stroke-width="1.2"/>
    <path d="M 212.0 52.0 A 194 194 0 0 1 286.2 66.8 L 279.0 84.3 A 175.0 175.0 0 0 0 212.0 71.0 Z" fill="#4a4a4a" stroke="#333333" stroke-width="1.2"/>

    <circle cx="212" cy="246" r="30" fill="#e0e7e5" stroke="#004d40" stroke-width="1.2"/>
    <text x="212" y="250" font-size="10" fill="#004d40" text-anchor="middle">as</text>

    <text x="448" y="52" font-size="13" fill="#222222" font-weight="600">Zones</text>
    <rect x="448" y="73" width="13" height="13" fill="#6b6b6b" fill-opacity="0.16" stroke="#6b6b6b"/>
    <text x="470" y="84" font-size="12" fill="#222222">buitenste zone</text>
    <text x="470" y="100" font-size="12" fill="#555555">16 sectoren per track</text>
    <rect x="448" y="123" width="13" height="13" fill="#3f7238" fill-opacity="0.16" stroke="#3f7238"/>
    <text x="470" y="134" font-size="12" fill="#222222">middelste zone</text>
    <text x="470" y="150" font-size="12" fill="#555555">12 sectoren per track</text>
    <rect x="448" y="173" width="13" height="13" fill="#9e2f26" fill-opacity="0.16" stroke="#9e2f26"/>
    <text x="470" y="184" font-size="12" fill="#222222">binnenste zone</text>
    <text x="470" y="200" font-size="12" fill="#555555">8 sectoren per track</text>
    <line x1="448" y1="216" x2="678" y2="216" stroke="#004d40" stroke-width="0.8" stroke-opacity="0.4"/>
    <text x="448" y="240" font-size="12" fill="#222222">Elke track in dezelfde zone draagt</text>
    <text x="448" y="256" font-size="12" fill="#222222">evenveel sectoren.</text>
    <text x="448" y="282" font-size="12" fill="#222222">De twee volle vlakken zijn elk een</text>
    <text x="448" y="298" font-size="12" fill="#222222">sector. Ze zijn even lang, want een</text>
    <text x="448" y="314" font-size="12" fill="#222222">sector draagt overal evenveel bits.</text>
    <text x="448" y="340" font-size="12" fill="#c0392b">De buitenste beslaat daardoor een</text>
    <text x="448" y="356" font-size="12" fill="#c0392b">halve hoek van de binnenste, en</text>
    <text x="448" y="372" font-size="12" fill="#c0392b">begint en eindigt dus op een andere</text>
    <text x="448" y="388" font-size="12" fill="#c0392b">plaats. Dat maakt de adressering</text>
    <text x="448" y="404" font-size="12" fill="#c0392b">moeilijker.</text>
</svg>
