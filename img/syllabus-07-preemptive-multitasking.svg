<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 770 156" width="770" height="156"
    font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="titel">
    <title id="titel">Preemptive multitasking: de process scheduler verdeelt de tijd zelf in stukjes en onderbreekt
        de twee processen om beurten</title>
    <rect width="770" height="156" fill="#ffffff" />

    <defs>
        <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#004d40" />
        </marker>
    </defs>

    <text x="15" y="24" font-size="17" fill="#00332b" font-weight="bold">Preemptive</text>

    <rect x="15" y="50" width="130" height="68" fill="#004d40" stroke="#004d40" />
    <text x="80" y="78" font-size="14" fill="#ffffff" text-anchor="middle">process</text>
    <text x="80" y="98" font-size="14" fill="#ffffff" text-anchor="middle">scheduler</text>

    <path d="M 148 64 L 268 64" stroke="#004d40" stroke-width="2" fill="none" marker-end="url(#p)" />
    <text x="208" y="56" font-size="13" fill="#004d40" text-anchor="middle">Proces 1</text>
    <path d="M 148 104 L 268 104" stroke="#004d40" stroke-width="2" fill="none" marker-end="url(#p)" />
    <text x="208" y="96" font-size="13" fill="#004d40" text-anchor="middle">Proces 2</text>

    <rect x="272" y="50" width="476" height="28" fill="#ffffff" stroke="#d5dedc" />
    <rect x="272" y="90" width="476" height="28" fill="#ffffff" stroke="#d5dedc" />

    <rect x="274" y="52" width="115" height="24" fill="#004d40" />
    <rect x="512" y="52" width="115" height="24" fill="#004d40" />
    <rect x="393" y="92" width="115" height="24" fill="#b2dfdb" stroke="#004d40" />
    <rect x="631" y="92" width="115" height="24" fill="#b2dfdb" stroke="#004d40" />

    <path d="M 391 42 L 391 126" stroke="#c0392b" stroke-width="2" stroke-dasharray="5 4" fill="none" />
    <path d="M 510 42 L 510 126" stroke="#c0392b" stroke-width="2" stroke-dasharray="5 4" fill="none" />
    <path d="M 629 42 L 629 126" stroke="#c0392b" stroke-width="2" stroke-dasharray="5 4" fill="none" />
    <text x="510" y="144" font-size="13" fill="#c0392b" text-anchor="middle">de scheduler onderbreekt</text>
</svg>
