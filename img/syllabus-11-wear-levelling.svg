<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 470" width="700" height="470"
     font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect width="700" height="470" fill="#ffffff"/>

    <defs>
        <marker id="pijl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#9e2f26"/>
        </marker>
        <marker id="pijlhost" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#004d40"/>
        </marker>
    </defs>

    <text x="26" y="26" font-size="12" fill="#555555">Het flashgeheugen van een SSD, als een rooster van pages</text>

    <!-- het rooster: een block van zestien pages -->
    <rect x="254" y="48" width="398" height="398" fill="#e0e7e5" stroke="#004d40" stroke-width="1.4"/>
    <rect x="268" y="62" width="88" height="88" fill="#ffffff" stroke="#004d40" stroke-width="0.9"/>
    <rect x="362" y="62" width="88" height="88" fill="#ffffff" stroke="#004d40" stroke-width="0.9"/>
    <rect x="456" y="62" width="88" height="88" fill="#ffffff" stroke="#004d40" stroke-width="0.9"/>
    <rect x="550" y="62" width="88" height="88" fill="#ffffff" stroke="#004d40" stroke-width="0.9"/>
    <rect x="268" y="156" width="88" height="88" fill="#ffffff" stroke="#004d40" stroke-width="0.9"/>
    <rect x="362" y="156" width="88" height="88" fill="#ffffff" stroke="#004d40" stroke-width="0.9"/>
    <rect x="456" y="156" width="88" height="88" fill="#ffffff" stroke="#004d40" stroke-width="0.9"/>
    <rect x="550" y="156" width="88" height="88" fill="#ffffff" stroke="#004d40" stroke-width="0.9"/>
    <rect x="268" y="250" width="88" height="88" fill="#ffffff" stroke="#004d40" stroke-width="0.9"/>
    <rect x="362" y="250" width="88" height="88" fill="#ffffff" stroke="#004d40" stroke-width="0.9"/>
    <rect x="456" y="250" width="88" height="88" fill="#ffffff" stroke="#004d40" stroke-width="0.9"/>
    <rect x="550" y="250" width="88" height="88" fill="#ffffff" stroke="#004d40" stroke-width="0.9"/>
    <rect x="268" y="344" width="88" height="88" fill="#ffffff" stroke="#004d40" stroke-width="0.9"/>
    <rect x="362" y="344" width="88" height="88" fill="#ffffff" stroke="#004d40" stroke-width="0.9"/>
    <rect x="456" y="344" width="88" height="88" fill="#ffffff" stroke="#004d40" stroke-width="0.9"/>
    <rect x="550" y="344" width="88" height="88" fill="#ffffff" stroke="#004d40" stroke-width="0.9"/>
    <text x="254" y="466" font-size="12" fill="#004d40">een block van zestien pages</text>

    <!-- de eerste schrijfoperatie, vanuit de computer -->
    <rect x="26" y="96" width="150" height="62" fill="#004d40" stroke="#004d40"/>
    <text x="101" y="122" font-size="13" fill="#ffffff" text-anchor="middle">4 KiB</text>
    <text x="101" y="140" font-size="11" fill="#ffffff" text-anchor="middle">uit de computer</text>
    <line x1="184" y1="127" x2="244" y2="106.0" stroke="#004d40" stroke-width="2" marker-end="url(#pijlhost)"/>

    <!-- dezelfde 4 KiB, vier keer herschreven, telkens op een andere page -->
    <rect x="276" y="70" width="72" height="72" fill="#004d40" stroke="#004d40"/>
    <text x="312.0" y="104.0" font-size="13" fill="#ffffff" text-anchor="middle">4 KiB</text>
    <text x="312.0" y="122.0" font-size="11" fill="#ffffff" text-anchor="middle">1e keer</text>
    <rect x="558" y="164" width="72" height="72" fill="#9e2f26" stroke="#9e2f26"/>
    <text x="594.0" y="198.0" font-size="13" fill="#ffffff" text-anchor="middle">4 KiB</text>
    <text x="594.0" y="216.0" font-size="11" fill="#ffffff" text-anchor="middle">2e keer</text>
    <rect x="370" y="258" width="72" height="72" fill="#9e2f26" stroke="#9e2f26"/>
    <text x="406.0" y="292.0" font-size="13" fill="#ffffff" text-anchor="middle">4 KiB</text>
    <text x="406.0" y="310.0" font-size="11" fill="#ffffff" text-anchor="middle">3e keer</text>
    <rect x="464" y="352" width="72" height="72" fill="#9e2f26" stroke="#9e2f26"/>
    <text x="500.0" y="386.0" font-size="13" fill="#ffffff" text-anchor="middle">4 KiB</text>
    <text x="500.0" y="404.0" font-size="11" fill="#ffffff" text-anchor="middle">4e keer</text>
    <line x1="349.9" y1="118.6" x2="552.3" y2="186.1" stroke="#9e2f26" stroke-width="2" marker-end="url(#pijl)"/>
    <line x1="558.2" y1="217.9" x2="445.4" y2="274.3" stroke="#9e2f26" stroke-width="2" marker-end="url(#pijl)"/>
    <line x1="434.3" y1="322.3" x2="468.9" y2="356.9" stroke="#9e2f26" stroke-width="2" marker-end="url(#pijl)"/>

    <text x="26" y="212" font-size="12" fill="#222222">Elke keer dat deze 4 KiB</text>
    <text x="26" y="228" font-size="12" fill="#222222">herschreven wordt, kiest de</text>
    <text x="26" y="244" font-size="12" fill="#222222">controller een andere page.</text>

    <text x="26" y="278" font-size="12" fill="#c0392b">Zo maakt elke geheugencel</text>
    <text x="26" y="294" font-size="12" fill="#c0392b">ongeveer evenveel schrijf-</text>
    <text x="26" y="310" font-size="12" fill="#c0392b">operaties mee, en niet die</text>
    <text x="26" y="326" font-size="12" fill="#c0392b">ene cel ze alle tienduizend.</text>

    <text x="26" y="362" font-size="12" fill="#555555">Dat heet wear levelling.</text>
</svg>
