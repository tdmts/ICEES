<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 770 440" width="770" height="440"
    font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="titel">
    <title id="titel">Swapping: het werkgeheugen zit vol en een nieuw programma kan er niet bij, dus schrijft het
        besturingssysteem de status van een weinig gebruikt programma naar het wisselbestand op de schijf en komt
        die plaats vrij</title>
    <rect width="770" height="440" fill="#ffffff" />

    <defs>
        <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#004d40" />
        </marker>
    </defs>

    <text x="15" y="30" font-size="16" fill="#00332b" font-weight="bold">Werkgeheugen zit vol</text>

    <rect x="15" y="46" width="520" height="56" fill="#ffffff" stroke="#004d40" />
    <rect x="17" y="48" width="127" height="52" fill="#004d40" />
    <text x="80" y="79" font-size="14" fill="#ffffff" text-anchor="middle">A</text>
    <rect x="146" y="48" width="127" height="52" fill="#004d40" />
    <text x="209" y="79" font-size="14" fill="#ffffff" text-anchor="middle">B</text>
    <rect x="275" y="48" width="127" height="52" fill="#b2dfdb" stroke="#004d40" />
    <text x="338" y="72" font-size="14" fill="#00332b" text-anchor="middle">C</text>
    <text x="338" y="91" font-size="13" fill="#00332b" text-anchor="middle">weinig gebruikt</text>
    <rect x="404" y="48" width="129" height="52" fill="#004d40" />
    <text x="468" y="79" font-size="14" fill="#ffffff" text-anchor="middle">D</text>

    <rect x="595" y="46" width="160" height="56" fill="#ffffff" stroke="#c0392b" stroke-width="2" />
    <text x="675" y="70" font-size="14" fill="#00332b" text-anchor="middle">E wil starten</text>
    <text x="675" y="89" font-size="13" fill="#c0392b" text-anchor="middle">geen plaats</text>

    <path d="M 338 108 L 338 172" stroke="#004d40" stroke-width="2" fill="none" marker-end="url(#p)" />
    <text x="352" y="146" font-size="13" fill="#004d40">de status van C gaat naar de schijf</text>

    <rect x="180" y="178" width="320" height="66" fill="#e0e7e5" stroke="#004d40" />
    <text x="340" y="202" font-size="14" fill="#00332b" text-anchor="middle">Schijf: wisselbestand</text>
    <rect x="270" y="210" width="140" height="24" fill="#b2dfdb" stroke="#004d40" />
    <text x="340" y="227" font-size="13" fill="#00332b" text-anchor="middle">status van C</text>

    <text x="180" y="276" font-size="13" fill="#c0392b">Spreekt de gebruiker C weer aan, dan gaat alles</text>
    <text x="180" y="294" font-size="13" fill="#c0392b">omgekeerd, en de schijf is vele malen trager</text>
    <text x="180" y="312" font-size="13" fill="#c0392b">dan het werkgeheugen.</text>

    <text x="15" y="352" font-size="16" fill="#00332b" font-weight="bold">Na het uitwisselen</text>

    <rect x="15" y="368" width="520" height="56" fill="#ffffff" stroke="#004d40" />
    <rect x="17" y="370" width="127" height="52" fill="#004d40" />
    <text x="80" y="401" font-size="14" fill="#ffffff" text-anchor="middle">A</text>
    <rect x="146" y="370" width="127" height="52" fill="#004d40" />
    <text x="209" y="401" font-size="14" fill="#ffffff" text-anchor="middle">B</text>
    <rect x="275" y="370" width="127" height="52" fill="#004d40" />
    <text x="338" y="401" font-size="14" fill="#ffffff" text-anchor="middle">E</text>
    <rect x="404" y="370" width="129" height="52" fill="#004d40" />
    <text x="468" y="401" font-size="14" fill="#ffffff" text-anchor="middle">D</text>
</svg>
