    <g font-size="13" fill="#222222" text-anchor="end">
        <text x="48" y="53">0</text>
        <text x="48" y="79">1</text>
        <text x="48" y="105">2</text>
        <text x="48" y="131">3</text>
        <text x="48" y="157">4</text>
        <text x="48" y="183">5</text>
        <text x="48" y="209">6</text>
        <text x="48" y="235">7</text>
        <text x="48" y="261">8</text>
        <text x="48" y="287">9</text>
        <text x="48" y="313">10</text>
        <text x="48" y="339">11</text>
