        <rect x="60" y="324" width="23" height="20" /> <rect x="83" y="324" width="23" height="20" /> <rect x="106" y="324" width="23" height="20" /> <rect x="129" y="324" width="23" height="20" />
        <rect x="152" y="324" width="23" height="20" /> <rect x="175" y="324" width="23" height="20" /> <rect x="198" y="324" width="23" height="20" /> <rect x="221" y="324" width="23" height="20" />
