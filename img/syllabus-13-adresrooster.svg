    <!-- de acht cellen achter een adres zijn samen 8 bits -->
    <path d="M 60 368 L 244 368" stroke="#004d40" stroke-width="1.4" fill="none"
        marker-start="url(#pijl-terug)" marker-end="url(#pijl)" />
    <text x="152" y="387" font-size="13" fill="#222222" text-anchor="middle">8 bits</text>
</svg>
