  <rect x="0" y="0" width="560" height="250" fill="#ffffff"/>

  <!-- de lintkabel zelf -->
  <rect x="40" y="60" width="460" height="80" fill="#e0e7e5" stroke="#9bb0ac" stroke-width="1.5"/>
